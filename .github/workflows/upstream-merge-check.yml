# Fork maintenance: dry-run merge of the latest upstream release into main.
#
# Runs every four hours. Finds the newest non-nightly upstream tag, merges it into a
# throwaway checkout, applies FORK.md's automatic conflict rules (lockfile and
# branding artwork), then runs the fork's targeted tests and package typechecks.
# Success is silent. A new failure writes a run summary and, when Issues is
# enabled, opens or updates a tracking issue. The same remaining conflicts for
# the same tag do not fail again. The real merge and push stay manual.
name: Upstream merge check

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-merge-check
  cancel-in-progress: true

env:
  UPSTREAM_REPO: https://github.com/pingdotgg/t3code.git
  ISSUE_TITLE_PREFIX: "Upstream merge check failed"

jobs:
  dry-merge:
    name: Dry-run merge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Resolve latest upstream release
        id: upstream
        run: |
          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream --quiet 'refs/tags/v*:refs/tags/upstream/v*'
          tag="$(git for-each-ref --format='%(refname:short)' 'refs/tags/upstream/v*' \
            | grep -v -- '-nightly' \
            | sed 's#^upstream/##' \
            | sort -V \
            | tail -n 1)"
          if test -z "$tag"; then
            echo "No upstream release tag found" >&2
            exit 1
          fi
          sha="$(git rev-parse "refs/tags/upstream/$tag^{commit}")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$sha" HEAD; then
            echo "main already contains upstream $tag ($sha)"
            echo "pending=false" >> "$GITHUB_OUTPUT"
          else
            echo "upstream $tag ($sha) is not yet merged into main"
            echo "pending=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream release
        if: steps.upstream.outputs.pending == 'true'
        id: merge
        run: |
          git config user.name "upstream-merge-check"
          git config user.email "upstream-merge-check@users.noreply.github.com"
          sha="${{ steps.upstream.outputs.sha }}"
          echo "status=clean" >> "$GITHUB_OUTPUT"
          if git merge --no-ff --no-edit "$sha"; then
            echo "clean merge"
            exit 0
          fi
          remaining="$(node .github/scripts/resolve-fork-merge-conflicts.cjs --upstream-sha "$sha")"
          if test -z "$remaining"; then
            git -c core.editor=true commit --no-edit
            echo "status=resolved" >> "$GITHUB_OUTPUT"
            echo "merged; automatic conflict resolutions applied"
            exit 0
          fi
          fingerprint="$(printf '%s\n' "$remaining" | sha256sum | awk '{print $1}')"
          {
            echo "status=conflicts"
            echo "fingerprint=$fingerprint"
            echo "conflicts<<EOF_CONFLICTS"
            printf '%s\n' "$remaining"
            echo "EOF_CONFLICTS"
          } >> "$GITHUB_OUTPUT"
          echo "Remaining conflicting files:" >&2
          printf '%s\n' "$remaining" >&2

      - name: Restore pending-report marker
        if: steps.merge.outputs.status == 'conflicts'
        id: pending-cache
        uses: actions/cache/restore@v4
        with:
          path: .upstream-merge-pending
          key: upstream-merge-pending-${{ steps.upstream.outputs.tag }}-${{ steps.upstream.outputs.sha }}-${{ steps.merge.outputs.fingerprint }}

      - name: Note repeated conflict report
        if: steps.merge.outputs.status == 'conflicts' && steps.pending-cache.outputs.cache-hit == 'true'
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
          SHA: ${{ steps.upstream.outputs.sha }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        run: |
          printf 'Already reported conflicts for `%s` (`%s`). Still waiting for a manual merge.\n\n```\n%s\n```\n' \
            "$TAG" "$SHA" "$CONFLICTS" >> "$GITHUB_STEP_SUMMARY"

      - name: Record first conflict report
        if: steps.merge.outputs.status == 'conflicts' && steps.pending-cache.outputs.cache-hit != 'true'
        env:
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        run: printf '%s\n' "$CONFLICTS" > .upstream-merge-pending

      - name: Save pending-report marker
        if: steps.merge.outputs.status == 'conflicts' && steps.pending-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .upstream-merge-pending
          key: upstream-merge-pending-${{ steps.upstream.outputs.tag }}-${{ steps.upstream.outputs.sha }}-${{ steps.merge.outputs.fingerprint }}

      - name: Fail on new merge conflicts
        if: steps.merge.outputs.status == 'conflicts' && steps.pending-cache.outputs.cache-hit != 'true'
        env:
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        run: |
          echo "Conflicting files:" >&2
          printf '%s\n' "$CONFLICTS" >&2
          exit 1

      - name: Setup Vite+
        if: steps.upstream.outputs.pending == 'true' && (steps.merge.outputs.status == 'clean' || steps.merge.outputs.status == 'resolved')
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install
        if: steps.upstream.outputs.pending == 'true' && (steps.merge.outputs.status == 'clean' || steps.merge.outputs.status == 'resolved')
        run: vp install --no-frozen-lockfile

      - name: Math rendering tests
        if: steps.upstream.outputs.pending == 'true' && (steps.merge.outputs.status == 'clean' || steps.merge.outputs.status == 'resolved')
        run: >
          vp test run
          apps/web/src/markdown-math.test.ts
          apps/web/src/components/ChatMarkdown.test.tsx
          apps/web/src/markdown-clipboard.test.ts

      - name: Branding tests
        if: steps.upstream.outputs.pending == 'true' && (steps.merge.outputs.status == 'clean' || steps.merge.outputs.status == 'resolved')
        run: >
          vp test run
          apps/web/src/branding.test.ts
          apps/desktop/src/app/DesktopAppIdentity.test.ts
          scripts/build-desktop-artifact.test.ts

      - name: Conflict resolver tests
        if: steps.upstream.outputs.pending == 'true' && (steps.merge.outputs.status == 'clean' || steps.merge.outputs.status == 'resolved')
        run: node --test .github/scripts/resolve-fork-merge-conflicts.test.cjs

      - name: Typecheck touched packages
        if: steps.upstream.outputs.pending == 'true' && (steps.merge.outputs.status == 'clean' || steps.merge.outputs.status == 'resolved')
        run: >
          vp run
          --filter @t3tools/web
          --filter @t3tools/desktop
          --filter @t3tools/mobile
          --filter @t3tools/scripts
          typecheck

      - name: Report failure
        if: failure() && steps.upstream.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
          SHA: ${{ steps.upstream.outputs.sha }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="$ISSUE_TITLE_PREFIX: $TAG"
          if test -n "$CONFLICTS"; then
            detail="$(printf 'Merge conflicts:\n\n```\n%s\n```\n' "$CONFLICTS")"
          else
            detail="The merge applied cleanly but a test or typecheck step failed. See the run log."
          fi
          body="$(printf 'Dry-run merge of upstream `%s` (`%s`) into `main` failed.\n\n%s\n\nRun: %s\n\nResolve per FORK.md, merge manually, and close this issue once `main` contains the release.\n' \
            "$TAG" "$SHA" "$detail" "$RUN_URL")"
          printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"
          if test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.has_issues')" != "true"; then
            echo "Issues is disabled; failure details are available in the run summary."
            exit 0
          fi
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          if test -n "$existing"; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
