name: 浏览器公式上游自动合并

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-math-upstream
  cancel-in-progress: false

jobs:
  stable:
    if: github.repository == 'pomelo-akiyama/t3code'
    uses: ./.github/workflows/fork-math-merge.yml
    secrets: inherit
